<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexa Sign Up</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --nx-bg: #eef2f7;
      --nx-surface: #ffffff;
      --nx-border: #e5e9f0;
      --nx-text: #0f1b2d;
      --nx-text-dim: #6b7a92;
      --nx-primary: #166fe5;
      --nx-primary-dk: #0b5bd3;
      --nx-font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --nx-font-display: 'Sora', 'Plus Jakarta Sans', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--nx-font-body);
      background: var(--nx-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .aurora span {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4;
      animation: drift 18s ease-in-out infinite;
    }
    .aurora span:nth-child(1) { width: 520px; height: 520px; background: #bcd6fb; top: -160px; left: -120px; }
    .aurora span:nth-child(2) { width: 460px; height: 460px; background: #c9f2e2; bottom: -160px; right: -120px; animation-delay: -6s; }
    .aurora span:nth-child(3) { width: 380px; height: 380px; background: #d9e6fd; top: 40%; left: 55%; animation-delay: -11s; opacity: 0.5; }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(60px, -40px) scale(1.1); }
      66% { transform: translate(-40px, 50px) scale(0.95); }
    }

    .card {
      position: relative; z-index: 2; width: 100%; max-width: 430px; margin: 20px;
      background: var(--nx-surface); padding: 2.75rem 2.5rem; border-radius: 24px;
      border: 1px solid var(--nx-border);
      box-shadow: 0 18px 50px rgba(15, 27, 45, 0.12);
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: none; } }

    .brand { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 1.75rem; }
    .brand-mark {
      width: 64px; height: 64px; border-radius: 18px;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(22, 111, 229, 0.28);
      position: relative;
      overflow: hidden;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; position: relative; z-index: 1; display: block; }
    .brand-name { font-family: var(--nx-font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--nx-text); }
    .brand-sub { font-size: 13px; color: var(--nx-text-dim); margin-top: -8px; font-weight: 500; }

    .input-group { position: relative; margin-bottom: 1rem; width: 100%; display: flex; align-items: center; }

    .password-toggle-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: #6b7a92; cursor: pointer;
      padding: 6px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; z-index: 10; border-radius: 50%;
    }
    .password-toggle-btn:hover { color: var(--nx-primary); background: rgba(22, 111, 229, 0.10); }
    .password-toggle-btn svg {
      width: 20px; height: 20px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
    }

    input#password { padding-right: 52px !important; }

    input[type="text"], input[type="email"], input[type="password"], input:not([type]) {
      width: 100%; padding: 14px 16px; border-radius: 13px;
      border: 1.5px solid var(--nx-border); background: #f7f9fc; color: var(--nx-text);
      font-size: 15px; font-weight: 500; font-family: inherit;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); box-sizing: border-box; outline: none;
      backdrop-filter: none;
    }
    input:focus { border-color: var(--nx-primary); background: #fff; box-shadow: 0 0 0 4px rgba(22, 111, 229, 0.14); }
    input::placeholder { color: var(--nx-text-dim); }

    button#signupBtn {
      width: 100%; padding: 15px; border: none; border-radius: 13px;
      background: linear-gradient(135deg, var(--nx-primary), var(--nx-primary-dk));
      color: #fff; font-weight: 700; font-size: 15px; font-family: var(--nx-font-display);
      letter-spacing: 0.3px; cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); margin-top: 0.5rem;
      box-shadow: 0 8px 22px rgba(22, 111, 229, 0.32);
    }
    button#signupBtn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(22, 111, 229, 0.40); }
    button#signupBtn:active { transform: translateY(0) scale(0.99); }

    .login-link { text-align: center; margin-top: 1.5rem; font-size: 13.5px; color: var(--nx-text-dim); }
    .login-link a { color: var(--nx-primary); font-weight: 700; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    .msg { text-align: center; margin-top: 14px; font-size: 13px; font-weight: 600; min-height: 20px; }
    .error { color: #e11d48; }
    .success { color: #16a34a; }
  </style>
</head>

<body>

<div class="aurora"><span></span><span></span><span></span></div>

<div class="card">

  <div class="brand">
    <div class="brand-mark">
      <img src="icon-512.png" alt="Nexa" />
    </div>
    <div class="brand-name">Nexa</div>
    <div class="brand-sub">Create your account to get started.</div>
  </div>

  <div class="input-group">
    <input id="username" placeholder="Username">
  </div>

  <div class="input-group">
    <input id="displayName" placeholder="Display Name">
  </div>

  <div class="input-group">
    <input id="email" placeholder="Email Address">
  </div>

  <div class="input-group">
    <input id="password" type="password" placeholder="Password" style="padding-right: 48px;">
    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility">
      <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <button id="signupBtn">Create Account</button>

  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>

  <p id="msg" class="msg"></p>

</div>

<script type="module">

// 🔥 Firebase Imports
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore,
  setDoc,
  doc,
  getDocs,
  query,
  where,
  collection,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBczCrV1vpJB_0DTsbBDupTXQuEV7l5IDg",
  authDomain: "mel-odix.firebaseapp.com",
  projectId: "mel-odix",
  storageBucket: "mel-odix.firebasestorage.app",
  messagingSenderId: "217595352090",
  appId: "1:217595352090:web:56696fd53ae5bb59d2eda3"
};

// INIT
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Enable local persistence
setPersistence(auth, browserLocalPersistence).catch(err => console.warn("Persistence error:", err));

// UI
const msg = document.getElementById("msg");
const btn = document.getElementById("signupBtn");

let isCreatingAccount = false;

// AUTO-LOGIN CHECK: If already logged in, redirect to dashboard
onAuthStateChanged(auth, (user) => {
  if (user && !isCreatingAccount) {
    window.location.replace("dashboard.html");
  }
});

const togglePasswordBtn = document.getElementById("togglePasswordBtn");
const passwordInput = document.getElementById("password");
const eyeIcon = document.getElementById("eyeIcon");

if (togglePasswordBtn && passwordInput && eyeIcon) {
  togglePasswordBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isPassword = passwordInput.getAttribute("type") === "password" || passwordInput.type === "password";
    const newType = isPassword ? "text" : "password";
    passwordInput.setAttribute("type", newType);
    passwordInput.type = newType;
    eyeIcon.innerHTML = isPassword
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });
}

["username", "displayName", "email", "password"].forEach(id => {
  const inp = document.getElementById(id);
  if (inp) {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        signup();
      }
    });
  }
});

btn.addEventListener("click", (e) => {
  e.preventDefault();
  signup();
});


async function signup() {

  const username = document.getElementById("username").value.trim();
  const displayName = document.getElementById("displayName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !displayName || !email || !password) {
    showMsg("Please fill all fields", "error");
    return;
  }

  isCreatingAccount = true;
  btn.disabled = true;
  btn.innerText = "Creating account...";

  try {

    // 🔐 CREATE USER
    const userCredential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = userCredential.user;

    // Referral: if the visitor arrived via ?ref=<username>, record who referred
    // them on their user doc (and bump the inviter's referralCount).
    let referredBy = null;
    try {
      const ref = new URLSearchParams(window.location.search).get("ref");
      if (ref) referredBy = ref.trim().toLowerCase();
    } catch (e) {}

    // 🗄️ SAVE PROFILE
    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      username,
      displayName,
      name: displayName,
      email,
      photo: "https://i.imgur.com/HeIi0wU.png",
      photoUrl: "https://i.imgur.com/HeIi0wU.png",
      status: "online",
      lastSeen: Date.now(),
      banned: false,
      profileSetupComplete: true,
      createdAt: Date.now(),
      ...(referredBy ? { referredBy } : {})
    });

    // Credit the referrer (best-effort — don't block signup if it fails).
    if (referredBy) {
      try {
        const q = query(collection(db, "users"), where("username", "==", referredBy));
        const snap = await getDocs(q);
        if (!snap.empty) {
          const refDoc = snap.docs[0];
          await updateDoc(doc(db, "users", refDoc.id), {
            referralCount: increment(1),
            referrals: (refDoc.data().referrals || []).concat([user.uid])
          });
        }
      } catch (e) { console.warn("Referral credit failed:", e); }
    }

    // ✅ SUCCESS POPUP
    showPopup("Account created successfully 🚀");

    showMsg("Success! Redirecting to Nexa...", "success");

    setTimeout(() => {
      window.location.replace("dashboard.html");
    }, 800);

  } catch (error) {
    isCreatingAccount = false;
    showMsg(error.message, "error");
    btn.disabled = false;
    btn.innerText = "Sign Up";
  }
}

// MESSAGE
function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg " + type;
}

// POPUP
function showPopup(text) {
  const popup = document.createElement("div");

  popup.innerText = text;

  popup.style.position = "fixed";
  popup.style.top = "20px";
  popup.style.left = "50%";
  popup.style.transform = "translateX(-50%)";
  popup.style.background = "#1a2230";
  popup.style.color = "#ffffff";
  popup.style.padding = "12px 20px";
  popup.style.borderRadius = "10px";
  popup.style.fontWeight = "bold";
  popup.style.zIndex = "9999";

  document.body.appendChild(popup);

  setTimeout(() => popup.remove(), 1500);
}

</script>


</body>
</html>
