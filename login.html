<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: var(--font-body);
      background: radial-gradient(circle at 20% 20%, rgba(43, 143, 255, 0.15), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(43, 143, 255, 0.12), transparent 45%),
                  var(--bg-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      padding: 3rem 2.5rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--glass-border-strong);
      backdrop-filter: blur(24px);
      box-shadow: var(--shadow-sm);
      animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h2 {
      font-family: var(--font-display);
      text-align: center;
      color: #ffffff;
      margin-bottom: 2rem;
      font-size: var(--text-3xl);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #7a8899;
      cursor: pointer;
      padding: 6px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 10;
      border-radius: 50%;
    }

    .password-toggle-btn:hover {
      color: var(--color-primary);
      background: var(--color-primary-soft);
      transform: translateY(-50%);
      box-shadow: none;
    }

    .password-toggle-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    input#password {
      padding-right: 52px !important;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid rgba(79, 143, 255, 0.15);
      background: rgba(10, 14, 39, 0.6);
      color: #fff;
      font-size: var(--text-base);
      font-weight: 500;
      transition: all var(--transition-base);
      box-sizing: border-box;
      outline: none;
    }

    input:focus {
      border-color: var(--color-primary);
      background: rgba(10, 14, 39, 0.8);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    input::placeholder {
      color: var(--text-tertiary);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), var(--color-tertiary));
      color: #070b19;
      font-weight: 700;
      font-size: var(--text-base);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-sm);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    button:active {
      transform: translateY(0);
    }

    .forgot {
      text-align: right;
      margin-bottom: 1.5rem;
      margin-top: -0.5rem;
    }

    .forgot a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: var(--text-sm);
      transition: color var(--transition-fast);
    }

    .forgot a:hover {
      color: var(--color-primary);
      text-shadow: none;
    }

    .signup-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .signup-link a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-shadow: none;
    }

    .msg {
      text-align: center;
      margin-top: 15px;
      font-size: var(--text-sm);
      font-weight: 600;
      min-height: 20px;
    }

    .error { color: #ff5252; text-shadow: none; }
    .success { color: #00e676; text-shadow: none; }
  </style>
</head>

<body>

<div class="card">

  <h2>Welcome Back</h2>

  <div class="input-group">
    <input type="email" id="email" placeholder="Email Address">
  </div>
  
  <div class="input-group">
    <input type="password" id="password" placeholder="Password" style="padding-right: 48px;">
    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility">
      <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="forgot">
    <a href="#" id="forgotPassword">Forgot Password?</a>
  </div>

  <button id="loginBtn">Login</button>

  <div class="signup-link">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </div>

  <div id="msg" class="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBczCrV1vpJB_0DTsbBDupTXQuEV7l5IDg",
  authDomain: "mel-odix.firebaseapp.com",
  projectId: "mel-odix",
  storageBucket: "mel-odix.firebasestorage.app",
  messagingSenderId: "217595352090",
  appId: "1:217595352090:web:56696fd53ae5bb59d2eda3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Enable local persistence
setPersistence(auth, browserLocalPersistence).catch(err => {
  console.warn("Persistence error:", err);
});

const msg = document.getElementById("msg");
const btn = document.getElementById("loginBtn");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = `msg ${type}`;
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("banned") === "1") {
  showMsg("🚫 Your account has been banned by an administrator.", "error");
} else if (urlParams.get("deleted") === "1") {
  showMsg("❌ Your account has been deleted by an administrator.", "error");
}

// AUTO-LOGIN LISTENER
let isAutoLoggingIn = false;
onAuthStateChanged(auth, async (user) => {
  if (user && !isAutoLoggingIn) {
    isAutoLoggingIn = true;
    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists() && userDoc.data().banned === true) {
        await signOut(auth);
        showMsg("🚫 Your account has been banned by an administrator.", "error");
        isAutoLoggingIn = false;
        return;
      }
      showMsg("✨ Auto-logging in...", "success");
      window.location.replace("dashboard.html");
    } catch (e) {
      console.warn("Auto-login check issue:", e);
      window.location.replace("dashboard.html");
    }
  }
});

const togglePasswordBtn = document.getElementById("togglePasswordBtn");
const passwordInput = document.getElementById("password");
const emailInput = document.getElementById("email");
const eyeIcon = document.getElementById("eyeIcon");

if (togglePasswordBtn && passwordInput && eyeIcon) {
  togglePasswordBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isPassword = passwordInput.getAttribute("type") === "password" || passwordInput.type === "password";
    const newType = isPassword ? "text" : "password";
    passwordInput.setAttribute("type", newType);
    passwordInput.type = newType;
    eyeIcon.innerHTML = isPassword
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });
}

[emailInput, passwordInput].forEach(inp => {
  if (inp) {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        login();
      }
    });
  }
});

btn.addEventListener("click", (e) => {
  e.preventDefault();
  login();
});

document
  .getElementById("forgotPassword")
  .addEventListener("click", resetPassword);

async function login(){

  const email = emailInput ? emailInput.value.trim() : "";
  const password = passwordInput ? passwordInput.value : "";

  if(!email || !password){
    showMsg("Please enter both email and password", "error");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  try {

    const userCred = await signInWithEmailAndPassword(auth, email, password);

    // Check ban status safely
    try {
      const userDoc = await getDoc(doc(db, "users", userCred.user.uid));
      if (userDoc.exists() && userDoc.data().banned === true) {
        await signOut(auth);
        showMsg("🚫 Your account has been banned by an administrator.", "error");
        btn.disabled = false;
        btn.innerText = "Login";
        return;
      }
    } catch (docErr) {
      console.warn("User ban check warning:", docErr);
    }

    showMsg("Login successful! Redirecting...", "success");

    setTimeout(()=>{
      window.location.href = "dashboard.html";
    }, 400);

  } catch (error) {
    console.error("Login error:", error);
    let errMsg = error.message;
    if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
      errMsg = "Invalid email or password. Please check your credentials.";
    } else if (error.code === "auth/invalid-email") {
      errMsg = "Invalid email format.";
    } else if (error.code === "auth/too-many-requests") {
      errMsg = "Too many failed attempts. Please wait a moment and try again.";
    }
    showMsg(errMsg, "error");
  }

  btn.disabled = false;
  btn.innerText = "Login";
}


async function resetPassword(e){

  e.preventDefault();

  const email = emailInput ? emailInput.value.trim() : "";

  if(!email){
    showMsg("Enter your email first", "error");
    return;
  }

  try {

    await sendPasswordResetEmail(auth, email);

    showMsg(
      "Password reset link sent to your email",
      "success"
    );

  } catch (error) {
    showMsg(error.message, "error");
  }
}


</script>


</body>
</html>
