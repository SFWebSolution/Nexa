<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Nexa Messenger</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --nx-primary: #0b57d0;
      --nx-primary-dk: #0842a0;
      --nx-primary-lt: #1d6bf3;
      --nx-primary-glow: rgba(11, 87, 208, 0.28);
      --nx-primary-soft: rgba(11, 87, 208, 0.08);

      --nx-bg: #f4f6fa;
      --nx-surface: #ffffff;
      --nx-border: #e2e8f0;
      --nx-border-focus: #1d6bf3;

      --nx-text-0: #081226;
      --nx-text-1: #142036;
      --nx-text-dim: #5c6c84;
      --nx-text-muted: #8a99ad;

      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Sora', 'Plus Jakarta Sans', sans-serif;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--nx-bg);
      color: var(--nx-text-1);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Deep Blue & Luminous Mesh Background */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(1000px 500px at 15% 10%, rgba(11, 87, 208, 0.12), transparent 70%),
        radial-gradient(800px 600px at 85% 90%, rgba(29, 107, 243, 0.09), transparent 65%),
        radial-gradient(600px 400px at 50% 50%, rgba(37, 99, 235, 0.05), transparent 60%),
        var(--nx-bg);
    }

    .bg-mesh span {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatOrb 20s ease-in-out infinite alternate;
    }
    .bg-mesh span:nth-child(1) {
      width: 480px; height: 480px;
      background: #c3d9fe;
      top: -140px; left: -100px;
    }
    .bg-mesh span:nth-child(2) {
      width: 420px; height: 420px;
      background: #d4e3fc;
      bottom: -120px; right: -100px;
      animation-delay: -7s;
    }
    .bg-mesh span:nth-child(3) {
      width: 320px; height: 320px;
      background: #e0ecff;
      top: 35%; right: 20%;
      animation-delay: -14s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 35px) scale(0.96); }
    }

    /* Card Container */
    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: var(--nx-surface);
      border-radius: 24px;
      padding: 40px 36px;
      border: 1px solid rgba(11, 87, 208, 0.14);
      box-shadow:
        0 4px 6px -1px rgba(8, 18, 38, 0.04),
        0 16px 40px -4px rgba(11, 87, 208, 0.10),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      animation: cardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: #ffffff;
      padding: 4px;
      margin-bottom: 14px;
      box-shadow:
        0 12px 28px rgba(11, 87, 208, 0.22),
        0 0 0 1px rgba(11, 87, 208, 0.12);
      transition: transform 0.3s ease;
    }
    .brand-logo-wrap:hover {
      transform: scale(1.05) rotate(2deg);
    }
    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
      display: block;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      color: var(--nx-text-0);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 13.5px;
      color: var(--nx-text-dim);
      font-weight: 500;
      line-height: 1.45;
    }

    /* Input Groups */
    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--nx-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 7px;
    }

    .input-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      width: 18px;
      height: 18px;
      color: var(--nx-text-muted);
      pointer-events: none;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-field-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 46px;
      font-size: 14.5px;
      font-family: inherit;
      font-weight: 500;
      color: var(--nx-text-1);
      background: #f8fafd;
      border: 1.5px solid var(--nx-border);
      border-radius: 14px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-field-wrap input:focus {
      background: #ffffff;
      border-color: var(--nx-primary);
      box-shadow: 0 0 0 4px rgba(11, 87, 208, 0.12);
    }

    .input-field-wrap input:focus + .input-icon,
    .input-field-wrap:focus-within .input-icon {
      color: var(--nx-primary);
    }

    .input-field-wrap input::placeholder {
      color: var(--nx-text-muted);
      font-weight: 400;
    }

    /* Password Toggle Button */
    .password-toggle-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--nx-text-muted);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .password-toggle-btn:hover {
      color: var(--nx-primary);
      background: rgba(11, 87, 208, 0.08);
    }
    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* Extras (Forgot link) */
    .form-extras {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
      margin-bottom: 22px;
    }

    .forgot-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--nx-primary);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .forgot-link:hover {
      color: var(--nx-primary-dk);
      text-decoration: underline;
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--nx-primary) 0%, var(--nx-primary-lt) 100%);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 24px var(--nx-primary-glow);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(11, 87, 208, 0.38);
    }

    .btn-submit:active {
      transform: translateY(0) scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Secondary Footer Link */
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: var(--nx-text-dim);
      font-weight: 500;
    }
    .auth-footer a {
      color: var(--nx-primary);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      transition: color 0.15s;
    }
    .auth-footer a:hover {
      color: var(--nx-primary-dk);
      text-decoration: underline;
    }

    /* Message / Feedback Pill */
    .msg {
      margin-top: 18px;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
      border-radius: 12px;
      padding: 0;
      min-height: 0;
      transition: all 0.25s ease;
    }

    .msg.error {
      padding: 11px 16px;
      color: #e11d48;
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.20);
    }

    .msg.success {
      padding: 11px 16px;
      color: #16a34a;
      background: rgba(22, 163, 74, 0.08);
      border: 1px solid rgba(22, 163, 74, 0.20);
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 32px 24px;
        border-radius: 20px;
      }
      .brand-title {
        font-size: 24px;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       FLUID & MODERN POLISH — auth pages (Nexa Deep Blue era)
       Additive ✦ layered on top of the classic card so login/signup
       never feel stale again.
       ═══════════════════════════════════════════════════════════════ */
    ::selection {
      background: rgba(11, 87, 208, 0.16);
    }

    body {
      background:
        radial-gradient(120% 90% at 12% 8%, rgba(11, 87, 208, 0.14), transparent 55%),
        radial-gradient(110% 100% at 88% 92%, rgba(29, 107, 243, 0.12), transparent 55%),
        linear-gradient(180deg, #f7f9fd 0%, #eef2fb 100%);
    }

    .auth-card {
      border-radius: 28px;
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      background: rgba(255, 255, 255, 0.92);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.9) inset,
        0 1px 2px rgba(8, 18, 38, 0.04),
        0 12px 24px -6px rgba(11, 87, 208, 0.10),
        0 32px 64px -24px rgba(11, 87, 208, 0.22);
    }

    /* Vertical brand accent bar on the card edge */
    .auth-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 32px;
      bottom: 32px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, #1d6bf3, #0b57d0 55%, rgba(11, 87, 208, 0.05));
      opacity: 0;
      transform: scaleY(0.6);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .auth-card:hover::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .brand-logo-wrap {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      margin-bottom: 16px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.9),
        0 14px 34px rgba(11, 87, 208, 0.28),
        0 4px 10px rgba(11, 87, 208, 0.12);
    }
    .brand-logo-wrap img {
      border-radius: 18px;
    }

    .brand-title {
      font-size: 28px;
      background: linear-gradient(120deg, #081226 20%, #0b57d0 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .brand-sub {
      font-size: 14px;
      max-width: 280px;
      margin: 0 auto;
    }

    .input-field-wrap input {
      height: 52px;
      border-radius: 16px;
      background: color-mix(in srgb, #f8fafd 92%, transparent);
      border-color: color-mix(in srgb, var(--nx-border) 85%, #ffffff);
    }
    .input-field-wrap input:focus {
      box-shadow:
        0 0 0 4px rgba(11, 87, 208, 0.13),
        inset 0 1px 2px rgba(8, 18, 38, 0.03);
    }

    .input-label {
      font-size: 11px;
      letter-spacing: 1px;
    }

    .btn-submit {
      height: 52px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(120deg, var(--nx-primary) 0%, var(--nx-primary-lt) 60%, #3b82f6 100%);
    }
    .btn-submit::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 45%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-22deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }
    .btn-submit:hover::after {
      left: 130%;
    }
    .btn-submit:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 18px 40px rgba(11, 87, 208, 0.45);
    }

    .auth-footer a {
      position: relative;
    }
    .auth-footer a::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: -2px;
      height: 1.5px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--nx-primary), var(--nx-primary-lt));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-footer a:hover::after {
      transform: scaleX(1);
    }

    .msg.error,
    .msg.success {
      animation: pillPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pillPop {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .auth-card { animation: none; }
      .btn-submit::after { display: none; }
    }
  </style>
</head>

<body>

<div class="bg-mesh">
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="auth-card">

  <div class="brand-header">
    <div class="brand-logo-wrap">
      <img src="icon-512.png" alt="Nexa Messenger">
    </div>
    <h1 class="brand-title">Nexa</h1>
    <p class="brand-sub">Welcome back. Sign in to your workspace.</p>
  </div>

  <div class="input-group">
    <label class="input-label" for="email">Email Address</label>
    <div class="input-field-wrap">
      <div class="input-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
    </div>
  </div>

  <div class="input-group">
    <label class="input-label" for="password">Password</label>
    <div class="input-field-wrap">
      <div class="input-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" style="padding-right: 46px;" required>
      <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility">
        <svg id="eyeIcon" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="form-extras">
    <a href="#" id="forgotPassword" class="forgot-link">Forgot password?</a>
  </div>

  <button id="loginBtn" class="btn-submit">
    <span>Sign In</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </svg>
  </button>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </div>

  <div id="msg" class="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBczCrV1vpJB_0DTsbBDupTXQuEV7l5IDg",
  authDomain: "mel-odix.firebaseapp.com",
  projectId: "mel-odix",
  storageBucket: "mel-odix.firebasestorage.app",
  messagingSenderId: "217595352090",
  appId: "1:217595352090:web:56696fd53ae5bb59d2eda3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Enable local persistence
setPersistence(auth, browserLocalPersistence).catch(err => {
  console.warn("Persistence error:", err);
});

const msg = document.getElementById("msg");
const btn = document.getElementById("loginBtn");

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = `msg ${type}`;
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("banned") === "1") {
  showMsg("🚫 Your account has been banned by an administrator.", "error");
} else if (urlParams.get("deleted") === "1") {
  showMsg("❌ Your account has been deleted by an administrator.", "error");
}

// Referral persistence: stash ?ref=<username> so the inviter gets credit even
// if the visitor browses to other pages before signing up.
try {
  const ref = urlParams.get("ref");
  if (ref) localStorage.setItem("nexa_referral", ref.trim().toLowerCase());
} catch (e) {}

// AUTO-LOGIN LISTENER
let isAutoLoggingIn = false;
onAuthStateChanged(auth, async (user) => {
  if (user && !isAutoLoggingIn) {
    isAutoLoggingIn = true;
    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists() && userDoc.data().banned === true) {
        await signOut(auth);
        showMsg("🚫 Your account has been banned by an administrator.", "error");
        isAutoLoggingIn = false;
        return;
      }
      showMsg("✨ Auto-logging in...", "success");
      window.location.replace("dashboard.html");
    } catch (e) {
      console.warn("Auto-login check issue:", e);
      window.location.replace("dashboard.html");
    }
  }
});

const togglePasswordBtn = document.getElementById("togglePasswordBtn");
const passwordInput = document.getElementById("password");
const emailInput = document.getElementById("email");
const eyeIcon = document.getElementById("eyeIcon");

if (togglePasswordBtn && passwordInput && eyeIcon) {
  togglePasswordBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isPassword = passwordInput.getAttribute("type") === "password" || passwordInput.type === "password";
    const newType = isPassword ? "text" : "password";
    passwordInput.setAttribute("type", newType);
    passwordInput.type = newType;
    eyeIcon.innerHTML = isPassword
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });
}

[emailInput, passwordInput].forEach(inp => {
  if (inp) {
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        login();
      }
    });
  }
});

btn.addEventListener("click", (e) => {
  e.preventDefault();
  login();
});

document
  .getElementById("forgotPassword")
  .addEventListener("click", resetPassword);

async function login(){

  const email = emailInput ? emailInput.value.trim() : "";
  const password = passwordInput ? passwordInput.value : "";

  if(!email || !password){
    showMsg("Please enter both email and password", "error");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span>Signing in...</span>`;

  try {

    const userCred = await signInWithEmailAndPassword(auth, email, password);

    // Check ban status safely
    try {
      const userDoc = await getDoc(doc(db, "users", userCred.user.uid));
      if (userDoc.exists() && userDoc.data().banned === true) {
        await signOut(auth);
        showMsg("🚫 Your account has been banned by an administrator.", "error");
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
        return;
      }
    } catch (docErr) {
      console.warn("User ban check warning:", docErr);
    }

    showMsg("Login successful! Redirecting...", "success");

    setTimeout(()=>{
      window.location.href = "dashboard.html";
    }, 400);

  } catch (error) {
    console.error("Login error:", error);
    let errMsg = error.message;
    if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
      errMsg = "Invalid email or password. Please check your credentials.";
    } else if (error.code === "auth/invalid-email") {
      errMsg = "Invalid email format.";
    } else if (error.code === "auth/too-many-requests") {
      errMsg = "Too many failed attempts. Please wait a moment and try again.";
    }
    showMsg(errMsg, "error");
  }

  btn.disabled = false;
  btn.innerHTML = `<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
}

async function resetPassword(e){

  e.preventDefault();

  const email = emailInput ? emailInput.value.trim() : "";

  if(!email){
    showMsg("Enter your email address first", "error");
    return;
  }

  try {

    await sendPasswordResetEmail(auth, email);

    showMsg(
      "Password reset link sent to your email",
      "success"
    );

  } catch (error) {
    showMsg(error.message, "error");
  }
}

</script>
